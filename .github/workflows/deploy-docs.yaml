name: Deploy Docusaurus Docs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual deployment

permissions:
  contents: write # force-push to gh-pages

concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Docusaurus Dependencies
        run: |
          cd docs
          npm ci

      - name: Generate API Docs
        run: npm run docs:generate

      - name: Build Docusaurus
        run: npm run docs:build

      - name: Deploy to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd docs/build
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy Docusaurus docs"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
