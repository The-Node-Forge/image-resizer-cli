name: Continuous Integration (CI)

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to push auto-format commits on non-PR runs

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Run Prettier and auto-fix
        run: npx prettier --write .

      - name: Run ESLint and auto-fix
        run: npx eslint . --fix

      - name: Ensure test files exist
        run: |
          if ! find ./tests ./src -type f -name "*.test.ts" -o -name "*.test.js" | grep .; then
            echo "::error::No test files found! PRs require tests."
            exit 1
          fi

      - name: Run Jest tests
        run: npm test -- --coverage

      - name: Upload Jest test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jest-results
          path: coverage

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: auto-format & lint fixes"

          if [[ "$GITHUB_REF" != refs/pull/* ]]; then
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF}"
          else
            echo "Skipping push: Cannot push changes to a PR merge ref."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
